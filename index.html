<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grok Fluid Light</title>
  <style>
    * {
      margin: 0;
      padding: 0
    }

    html,
    body {
      overflow: hidden;
      background: #000;
      width: 100vw;
      height: 100vh
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh
    }
  </style>
</head>

<body>
  <canvas id="c"></canvas>
  <script>
    'use strict';

    // ========== WebGL Fluid Simulation ==========
    // Based on Jos Stam "Stable Fluids" & Pavel Dobryakov's implementation
    // Single-file, zero dependencies

    const canvas = document.getElementById('c');
    const gl = canvas.getContext('webgl2', {
      alpha: false,
      depth: false,
      stencil: false,
      antialias: false,
      preserveDrawingBuffer: true
    });

    if (!gl) {
      alert('WebGL2 not supported');
      throw new Error('No WebGL2');
    }

    gl.getExtension('EXT_color_buffer_float');
    const supportLinearFiltering = gl.getExtension('OES_texture_float_linear');

    // Config
    const SIM_RES = 128;
    const DYE_RES = 1024;
    const DENSITY_DISSIPATION = 1.2;
    const VELOCITY_DISSIPATION = 0.15;
    const PRESSURE_ITERATIONS = 20;
    const CURL_STRENGTH = 25;
    const SPLAT_RADIUS = 0.0045;
    const BLOOM_INTENSITY = 2.0;
    const BLOOM_THRESHOLD = 0.05;

    // Resize
    function resize() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.floor(canvas.clientWidth * dpr);
      canvas.height = Math.floor(canvas.clientHeight * dpr);
    }
    resize();
    window.addEventListener('resize', resize);

    // Shader compilation
    function compileShader(type, src) {
      const s = gl.createShader(type);
      gl.shaderSource(s, src);
      gl.compileShader(s);
      if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
        console.error('Shader error:', gl.getShaderInfoLog(s));
      }
      return s;
    }

    function createProgram(vsSrc, fsSrc) {
      const vs = compileShader(gl.VERTEX_SHADER, vsSrc);
      const fs = compileShader(gl.FRAGMENT_SHADER, fsSrc);
      const p = gl.createProgram();
      gl.attachShader(p, vs);
      gl.attachShader(p, fs);
      gl.linkProgram(p);
      if (!gl.getProgramParameter(p, gl.LINK_STATUS)) {
        console.error('Program error:', gl.getProgramInfoLog(p));
      }
      const uniforms = {};
      const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
      for (let i = 0; i < n; i++) {
        const info = gl.getActiveUniform(p, i);
        uniforms[info.name] = gl.getUniformLocation(p, info.name);
      }
      return { program: p, uniforms, bind() { gl.useProgram(p); } };
    }

    // Fullscreen quad
    const quadVAO = gl.createVertexArray();
    gl.bindVertexArray(quadVAO);
    const quadBuf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
    gl.enableVertexAttribArray(0);
    gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
    gl.bindVertexArray(null);

    function blit(target) {
      gl.bindVertexArray(quadVAO);
      if (target) {
        gl.bindFramebuffer(gl.FRAMEBUFFER, target.fbo);
        gl.viewport(0, 0, target.width, target.height);
      } else {
        gl.bindFramebuffer(gl.FRAMEBUFFER, null);
        gl.viewport(0, 0, gl.drawingBufferWidth, gl.drawingBufferHeight);
      }
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
      gl.bindVertexArray(null);
    }

    // FBO helpers
    function createFBO(w, h, internalFormat, format, type, filter) {
      const tex = gl.createTexture();
      gl.bindTexture(gl.TEXTURE_2D, tex);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, filter);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, filter);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
      gl.texImage2D(gl.TEXTURE_2D, 0, internalFormat, w, h, 0, format, type, null);
      const fbo = gl.createFramebuffer();
      gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
      gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
      return {
        texture: tex, fbo, width: w, height: h,
        attach(id) { gl.activeTexture(gl.TEXTURE0 + id); gl.bindTexture(gl.TEXTURE_2D, tex); return id; }
      };
    }

    function createDoubleFBO(w, h, internalFormat, format, type, filter) {
      let fbo1 = createFBO(w, h, internalFormat, format, type, filter);
      let fbo2 = createFBO(w, h, internalFormat, format, type, filter);
      return {
        width: w, height: h,
        get read() { return fbo1; }, set read(v) { fbo1 = v; },
        get write() { return fbo2; }, set write(v) { fbo2 = v; },
        swap() { const t = fbo1; fbo1 = fbo2; fbo2 = t; }
      };
    }

    // Simulation resolution
    function getSimRes(res) {
      const ar = gl.drawingBufferWidth / gl.drawingBufferHeight;
      let w = Math.round(res * (ar > 1 ? ar : 1));
      let h = Math.round(res * (ar > 1 ? 1 : 1 / ar));
      return { width: w, height: h };
    }

    const filter = supportLinearFiltering ? gl.LINEAR : gl.NEAREST;
    const halfFloat = gl.HALF_FLOAT;

    const simSize = getSimRes(SIM_RES);
    const dyeSize = getSimRes(DYE_RES);

    let velocity = createDoubleFBO(simSize.width, simSize.height, gl.RG16F, gl.RG, halfFloat, filter);
    let dye = createDoubleFBO(dyeSize.width, dyeSize.height, gl.RGBA16F, gl.RGBA, halfFloat, filter);
    let divergenceFBO = createFBO(simSize.width, simSize.height, gl.R16F, gl.RED, halfFloat, gl.NEAREST);
    let curlFBO = createFBO(simSize.width, simSize.height, gl.R16F, gl.RED, halfFloat, gl.NEAREST);
    let pressure = createDoubleFBO(simSize.width, simSize.height, gl.R16F, gl.RED, halfFloat, gl.NEAREST);

    // Bloom FBOs
    const bloomRes = getSimRes(256);
    let bloomFBO = createFBO(bloomRes.width, bloomRes.height, gl.RGBA16F, gl.RGBA, halfFloat, filter);
    let bloomFBOs = [];
    for (let i = 0; i < 8; i++) {
      let w = bloomRes.width >> (i + 1);
      let h = bloomRes.height >> (i + 1);
      if (w < 2 || h < 2) break;
      bloomFBOs.push(createFBO(w, h, gl.RGBA16F, gl.RGBA, halfFloat, filter));
    }

    // ========== SHADERS ==========
    const baseVS = `#version 300 es
precision highp float;
layout(location=0) in vec2 aPosition;
out vec2 vUv;
out vec2 vL, vR, vT, vB;
uniform vec2 texelSize;
void main(){
  vUv = aPosition * 0.5 + 0.5;
  vL = vUv - vec2(texelSize.x, 0);
  vR = vUv + vec2(texelSize.x, 0);
  vT = vUv + vec2(0, texelSize.y);
  vB = vUv - vec2(0, texelSize.y);
  gl_Position = vec4(aPosition, 0, 1);
}`;

    const splatProg = createProgram(baseVS, `#version 300 es
precision highp float;
in vec2 vUv;
out vec4 fragColor;
uniform sampler2D uTarget;
uniform float aspectRatio;
uniform vec3 color;
uniform vec2 point;
uniform float radius;
void main(){
  vec2 p = vUv - point;
  p.x *= aspectRatio;
  vec3 splat = exp(-dot(p,p) / radius) * color;
  vec3 base = texture(uTarget, vUv).xyz;
  fragColor = vec4(base + splat, 1.0);
}`);

    const advectionProg = createProgram(baseVS, `#version 300 es
precision highp float;
in vec2 vUv;
out vec4 fragColor;
uniform sampler2D uVelocity;
uniform sampler2D uSource;
uniform vec2 texelSize;
uniform float dt;
uniform float dissipation;
void main(){
  vec2 coord = vUv - dt * texture(uVelocity, vUv).xy * texelSize;
  vec4 result = texture(uSource, coord);
  float decay = 1.0 + dissipation * dt;
  fragColor = result / decay;
}`);

    const divergenceProg = createProgram(baseVS, `#version 300 es
precision mediump float;
in vec2 vUv, vL, vR, vT, vB;
out vec4 fragColor;
uniform sampler2D uVelocity;
void main(){
  float L = texture(uVelocity, vL).x;
  float R = texture(uVelocity, vR).x;
  float T = texture(uVelocity, vT).y;
  float B = texture(uVelocity, vB).y;
  vec2 C = texture(uVelocity, vUv).xy;
  if(vL.x < 0.0) L = -C.x;
  if(vR.x > 1.0) R = -C.x;
  if(vT.y > 1.0) T = -C.y;
  if(vB.y < 0.0) B = -C.y;
  fragColor = vec4(0.5 * (R - L + T - B), 0, 0, 1);
}`);

    const curlProg = createProgram(baseVS, `#version 300 es
precision mediump float;
in vec2 vUv, vL, vR, vT, vB;
out vec4 fragColor;
uniform sampler2D uVelocity;
void main(){
  float L = texture(uVelocity, vL).y;
  float R = texture(uVelocity, vR).y;
  float T = texture(uVelocity, vT).x;
  float B = texture(uVelocity, vB).x;
  fragColor = vec4(0.5 * (R - L - T + B), 0, 0, 1);
}`);

    const vorticityProg = createProgram(baseVS, `#version 300 es
precision highp float;
in vec2 vUv, vL, vR, vT, vB;
out vec4 fragColor;
uniform sampler2D uVelocity;
uniform sampler2D uCurl;
uniform float curl;
uniform float dt;
void main(){
  float L = texture(uCurl, vL).x;
  float R = texture(uCurl, vR).x;
  float T = texture(uCurl, vT).x;
  float B = texture(uCurl, vB).x;
  float C = texture(uCurl, vUv).x;
  vec2 force = 0.5 * vec2(abs(T) - abs(B), abs(R) - abs(L));
  force /= length(force) + 0.0001;
  force *= curl * C;
  force.y *= -1.0;
  vec2 vel = texture(uVelocity, vUv).xy;
  fragColor = vec4(vel + force * dt, 0, 1);
}`);

    const pressureProg = createProgram(baseVS, `#version 300 es
precision mediump float;
in vec2 vUv, vL, vR, vT, vB;
out vec4 fragColor;
uniform sampler2D uPressure;
uniform sampler2D uDivergence;
void main(){
  float L = texture(uPressure, vL).x;
  float R = texture(uPressure, vR).x;
  float T = texture(uPressure, vT).x;
  float B = texture(uPressure, vB).x;
  float div = texture(uDivergence, vUv).x;
  fragColor = vec4((L + R + B + T - div) * 0.25, 0, 0, 1);
}`);

    const gradSubProg = createProgram(baseVS, `#version 300 es
precision mediump float;
in vec2 vUv, vL, vR, vT, vB;
out vec4 fragColor;
uniform sampler2D uPressure;
uniform sampler2D uVelocity;
void main(){
  float L = texture(uPressure, vL).x;
  float R = texture(uPressure, vR).x;
  float T = texture(uPressure, vT).x;
  float B = texture(uPressure, vB).x;
  vec2 vel = texture(uVelocity, vUv).xy;
  vel -= vec2(R - L, T - B);
  fragColor = vec4(vel, 0, 1);
}`);

    const clearProg = createProgram(baseVS, `#version 300 es
precision mediump float;
in vec2 vUv;
out vec4 fragColor;
uniform sampler2D uTexture;
uniform float value;
void main(){
  fragColor = value * texture(uTexture, vUv);
}`);

    const displayProg = createProgram(baseVS, `#version 300 es
precision highp float;
in vec2 vUv, vL, vR, vT, vB;
out vec4 fragColor;
uniform sampler2D uTexture;
uniform sampler2D uBloom;
uniform vec2 texelSize;
void main(){
  vec3 c = texture(uTexture, vUv).rgb;
  // Shading
  vec3 lc = texture(uTexture, vL).rgb;
  vec3 rc = texture(uTexture, vR).rgb;
  vec3 tc = texture(uTexture, vT).rgb;
  vec3 bc = texture(uTexture, vB).rgb;
  float dx = length(rc) - length(lc);
  float dy = length(tc) - length(bc);
  vec3 n = normalize(vec3(dx, dy, length(texelSize)));
  float diffuse = clamp(dot(n, vec3(0,0,1)) + 0.7, 0.7, 1.0);
  c *= diffuse;
  // Bloom
  vec3 bloom = texture(uBloom, vUv).rgb;
  c += bloom;
  fragColor = vec4(c, 1.0);
}`);

    const bloomPrefilterProg = createProgram(baseVS, `#version 300 es
precision mediump float;
in vec2 vUv;
out vec4 fragColor;
uniform sampler2D uTexture;
uniform vec3 curve;
uniform float threshold;
void main(){
  vec3 c = texture(uTexture, vUv).rgb;
  float br = max(c.r, max(c.g, c.b));
  float rq = clamp(br - curve.x, 0.0, curve.y);
  rq = curve.z * rq * rq;
  c *= max(rq, br - threshold) / max(br, 0.0001);
  fragColor = vec4(c, 0);
}`);

    const bloomBlurProg = createProgram(baseVS, `#version 300 es
precision mediump float;
in vec2 vL, vR, vT, vB;
out vec4 fragColor;
uniform sampler2D uTexture;
void main(){
  fragColor = 0.25 * (texture(uTexture,vL) + texture(uTexture,vR) + texture(uTexture,vT) + texture(uTexture,vB));
}`);

    const bloomFinalProg = createProgram(baseVS, `#version 300 es
precision mediump float;
in vec2 vL, vR, vT, vB;
out vec4 fragColor;
uniform sampler2D uTexture;
uniform float intensity;
void main(){
  fragColor = intensity * 0.25 * (texture(uTexture,vL) + texture(uTexture,vR) + texture(uTexture,vT) + texture(uTexture,vB));
}`);

    const colorProg = createProgram(baseVS, `#version 300 es
precision mediump float;
out vec4 fragColor;
uniform vec4 color;
void main(){ fragColor = color; }`);

    // ========== SIMULATION ==========
    function splat(x, y, dx, dy, color, radius) {
      splatProg.bind();
      gl.uniform1i(splatProg.uniforms.uTarget, velocity.read.attach(0));
      gl.uniform1f(splatProg.uniforms.aspectRatio, canvas.width / canvas.height);
      gl.uniform2f(splatProg.uniforms.point, x, y);
      gl.uniform3f(splatProg.uniforms.color, dx, -dy, 0);
      gl.uniform1f(splatProg.uniforms.radius, radius);
      blit(velocity.write);
      velocity.swap();

      gl.uniform1i(splatProg.uniforms.uTarget, dye.read.attach(0));
      gl.uniform3f(splatProg.uniforms.color, color.r, color.g, color.b);
      blit(dye.write);
      dye.swap();
    }

    function step(dt) {
      gl.disable(gl.BLEND);

      // Curl
      curlProg.bind();
      gl.uniform2f(curlProg.uniforms.texelSize, velocity.read.width > 0 ? 1.0 / velocity.read.width : 0, velocity.read.height > 0 ? 1.0 / velocity.read.height : 0);
      gl.uniform1i(curlProg.uniforms.uVelocity, velocity.read.attach(0));
      blit(curlFBO);

      // Vorticity
      vorticityProg.bind();
      gl.uniform2f(vorticityProg.uniforms.texelSize, 1.0 / velocity.read.width, 1.0 / velocity.read.height);
      gl.uniform1i(vorticityProg.uniforms.uVelocity, velocity.read.attach(0));
      gl.uniform1i(vorticityProg.uniforms.uCurl, curlFBO.attach(1));
      gl.uniform1f(vorticityProg.uniforms.curl, CURL_STRENGTH);
      gl.uniform1f(vorticityProg.uniforms.dt, dt);
      blit(velocity.write);
      velocity.swap();

      // Divergence
      divergenceProg.bind();
      gl.uniform2f(divergenceProg.uniforms.texelSize, 1.0 / velocity.read.width, 1.0 / velocity.read.height);
      gl.uniform1i(divergenceProg.uniforms.uVelocity, velocity.read.attach(0));
      blit(divergenceFBO);

      // Pressure clear
      clearProg.bind();
      gl.uniform1i(clearProg.uniforms.uTexture, pressure.read.attach(0));
      gl.uniform1f(clearProg.uniforms.value, 0.8);
      blit(pressure.write);
      pressure.swap();

      // Pressure solve
      pressureProg.bind();
      gl.uniform2f(pressureProg.uniforms.texelSize, 1.0 / velocity.read.width, 1.0 / velocity.read.height);
      gl.uniform1i(pressureProg.uniforms.uDivergence, divergenceFBO.attach(0));
      for (let i = 0; i < PRESSURE_ITERATIONS; i++) {
        gl.uniform1i(pressureProg.uniforms.uPressure, pressure.read.attach(1));
        blit(pressure.write);
        pressure.swap();
      }

      // Gradient subtract
      gradSubProg.bind();
      gl.uniform2f(gradSubProg.uniforms.texelSize, 1.0 / velocity.read.width, 1.0 / velocity.read.height);
      gl.uniform1i(gradSubProg.uniforms.uPressure, pressure.read.attach(0));
      gl.uniform1i(gradSubProg.uniforms.uVelocity, velocity.read.attach(1));
      blit(velocity.write);
      velocity.swap();

      // Advect velocity
      advectionProg.bind();
      gl.uniform2f(advectionProg.uniforms.texelSize, 1.0 / velocity.read.width, 1.0 / velocity.read.height);
      gl.uniform1i(advectionProg.uniforms.uVelocity, velocity.read.attach(0));
      gl.uniform1i(advectionProg.uniforms.uSource, velocity.read.attach(0));
      gl.uniform1f(advectionProg.uniforms.dt, dt);
      gl.uniform1f(advectionProg.uniforms.dissipation, VELOCITY_DISSIPATION);
      blit(velocity.write);
      velocity.swap();

      // Advect dye
      gl.uniform1i(advectionProg.uniforms.uVelocity, velocity.read.attach(0));
      gl.uniform1i(advectionProg.uniforms.uSource, dye.read.attach(1));
      gl.uniform1f(advectionProg.uniforms.dissipation, DENSITY_DISSIPATION);
      blit(dye.write);
      dye.swap();
    }

    function applyBloom() {
      if (bloomFBOs.length < 2) return;

      gl.disable(gl.BLEND);

      // Prefilter
      bloomPrefilterProg.bind();
      const knee = BLOOM_THRESHOLD * 0.7 + 0.0001;
      gl.uniform3f(bloomPrefilterProg.uniforms.curve, BLOOM_THRESHOLD - knee, knee * 2, 0.25 / knee);
      gl.uniform1f(bloomPrefilterProg.uniforms.threshold, BLOOM_THRESHOLD);
      gl.uniform1i(bloomPrefilterProg.uniforms.uTexture, dye.read.attach(0));
      blit(bloomFBO);

      // Downsample
      bloomBlurProg.bind();
      let last = bloomFBO;
      for (let i = 0; i < bloomFBOs.length; i++) {
        const dest = bloomFBOs[i];
        gl.uniform2f(bloomBlurProg.uniforms.texelSize, 1.0 / last.width, 1.0 / last.height);
        gl.uniform1i(bloomBlurProg.uniforms.uTexture, last.attach(0));
        blit(dest);
        last = dest;
      }

      // Upsample
      gl.blendFunc(gl.ONE, gl.ONE);
      gl.enable(gl.BLEND);
      for (let i = bloomFBOs.length - 2; i >= 0; i--) {
        const base = bloomFBOs[i];
        gl.uniform2f(bloomBlurProg.uniforms.texelSize, 1.0 / last.width, 1.0 / last.height);
        gl.uniform1i(bloomBlurProg.uniforms.uTexture, last.attach(0));
        gl.viewport(0, 0, base.width, base.height);
        gl.bindFramebuffer(gl.FRAMEBUFFER, base.fbo);
        gl.bindVertexArray(quadVAO);
        gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
        gl.bindVertexArray(null);
        last = base;
      }
      gl.disable(gl.BLEND);

      // Final bloom pass
      bloomFinalProg.bind();
      gl.uniform2f(bloomFinalProg.uniforms.texelSize, 1.0 / last.width, 1.0 / last.height);
      gl.uniform1i(bloomFinalProg.uniforms.uTexture, last.attach(0));
      gl.uniform1f(bloomFinalProg.uniforms.intensity, BLOOM_INTENSITY);
      blit(bloomFBO);
    }

    function render() {
      applyBloom();

      const w = gl.drawingBufferWidth;
      const h = gl.drawingBufferHeight;

      gl.viewport(0, 0, w, h);
      gl.bindFramebuffer(gl.FRAMEBUFFER, null);

      // Draw background
      gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
      gl.enable(gl.BLEND);

      colorProg.bind();
      gl.uniform4f(colorProg.uniforms.color, 3 / 255, 5 / 255, 8 / 255, 1);
      gl.bindVertexArray(quadVAO);
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
      gl.bindVertexArray(null);

      // Display dye + bloom
      displayProg.bind();
      gl.uniform2f(displayProg.uniforms.texelSize, 1.0 / w, 1.0 / h);
      gl.uniform1i(displayProg.uniforms.uTexture, dye.read.attach(0));
      gl.uniform1i(displayProg.uniforms.uBloom, bloomFBO.attach(1));
      gl.bindVertexArray(quadVAO);
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
      gl.bindVertexArray(null);
    }

    // ========== MOUSE ==========
    let mouseX = 0, mouseY = 0, prevMouseX = 0, prevMouseY = 0, mouseMoved = false;

    window.addEventListener('mousemove', e => {
      prevMouseX = mouseX;
      prevMouseY = mouseY;
      mouseX = e.clientX / canvas.clientWidth;
      mouseY = 1.0 - e.clientY / canvas.clientHeight;
      mouseMoved = true;
    });

    canvas.addEventListener('touchmove', e => {
      e.preventDefault();
      if (e.touches.length > 0) {
        prevMouseX = mouseX;
        prevMouseY = mouseY;
        mouseX = e.touches[0].clientX / canvas.clientWidth;
        mouseY = 1.0 - e.touches[0].clientY / canvas.clientHeight;
        mouseMoved = true;
      }
    }, { passive: false });

    // ========== MAIN LOOP ==========
    let lastTime = Date.now();

    function loop() {
      const now = Date.now();
      const dt = Math.min((now - lastTime) / 1000, 0.016);
      lastTime = now;

      // Right-edge emitter: constant stream of white/blue fluid
      const emitX = 0.90; // UV position (90% from left = near right edge)
      const emitY = 0.5 + Math.sin(now * 0.001) * 0.1; // Slight vertical oscillation
      const emitR = SPLAT_RADIUS * 5;
      const colorIntensity = 15;
      const emitColor = {
        r: (0.85 + Math.random() * 0.15) * colorIntensity,
        g: (0.90 + Math.random() * 0.10) * colorIntensity,
        b: 1.0 * colorIntensity
      };
      // Push fluid leftward
      splat(emitX, emitY, -50, (Math.random() - 0.5) * 15, emitColor, emitR);

      // Secondary wider emitter
      const emitY2 = 0.3 + Math.random() * 0.4;
      const emitColor2 = {
        r: 0.9 * colorIntensity * 0.7,
        g: 0.95 * colorIntensity * 0.7,
        b: 1.0 * colorIntensity * 0.7
      };
      splat(0.96, emitY2, -30, (Math.random() - 0.5) * 10, emitColor2, SPLAT_RADIUS * 3);

      // Mouse interaction: push velocity only (no dye)
      if (mouseMoved) {
        mouseMoved = false;
        const dx = (mouseX - prevMouseX) * 50;
        const dy = (mouseY - prevMouseY) * 50;
        if (Math.abs(dx) > 0.001 || Math.abs(dy) > 0.001) {
          splat(mouseX, mouseY, dx, dy, { r: 0, g: 0, b: 0 }, SPLAT_RADIUS);
        }
      }

      step(dt);
      render();
      requestAnimationFrame(loop);
    }

    loop();
  </script>
</body>
